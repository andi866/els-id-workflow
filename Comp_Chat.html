<script>
/* ============================================================
   KOTAK PERCAKAPAN

   Menempel pada satu transaksi, dipakai semua divisi yang
   menanganinya. Dipasang dengan satu baris di layar mana pun:

     Chat.pasang(trxId, 'id-wadah')

   Tidak ada layar tersendiri. Percakapan tentang sebuah pesanan
   tempatnya di pesanan itu, bukan di menu terpisah yang harus
   dicari — dan yang harus dicari biasanya tidak dibuka.
   ============================================================ */
var Chat = {
  trxId: null,
  wadah: null,
  terbuka: false,
  jeda: null,
  idTerakhir: null,

  pasang: function (trxId, idWadah) {
    var el = document.getElementById(idWadah || 'chat-box');
    if (!el) return;

    Chat.trxId = trxId;
    Chat.wadah = el;
    Chat.terbuka = false;

    el.innerHTML =
      '<div class="card mt16" style="border-left:4px solid var(--brand)">' +
        '<div class="between" id="chat-kepala" style="cursor:pointer">' +
          '<div>' +
            '<b>💬 Percakapan divisi</b>' +
            '<div class="note mb0">Tanya atau kabari divisi lain soal pesanan ini. ' +
            'Tercatat dan bisa dibaca semua yang menanganinya.</div>' +
          '</div>' +
          '<span class="badge" id="chat-jml">buka</span>' +
        '</div>' +
        '<div id="chat-isi" style="display:none"></div>' +
      '</div>';

    document.getElementById('chat-kepala').onclick = function () {
      Chat.terbuka = !Chat.terbuka;
      document.getElementById('chat-isi').style.display = Chat.terbuka ? '' : 'none';
      document.getElementById('chat-jml').textContent = Chat.terbuka ? 'tutup' : 'buka';
      if (Chat.terbuka) Chat.muat();
      Chat.aturJeda();
    };

    // Jumlah pesannya diintip dulu supaya terlihat ada isinya
    Chat.intip();
  },

  /*
   * Pesan masuk muncul sendiri selama kotaknya terbuka.
   *
   * Dihentikan begitu ditutup atau layarnya berpindah — percakapan
   * yang tidak sedang dilihat tidak perlu ditanyakan terus-menerus.
   */
  aturJeda: function () {
    clearInterval(Chat.jeda);
    if (!Chat.terbuka) return;

    Chat.jeda = setInterval(function () {
      if (!document.getElementById('chat-daftar')) { clearInterval(Chat.jeda); return; }
      if (document.hidden) return;
      Chat.muatBaru();
    }, 5000);
  },

  muatBaru: function () {
    var daftar = document.getElementById('chat-daftar');
    if (!daftar) return;

    api('apiChatList', { trx_id: Chat.trxId }).then(function (d) {
      if (!d.list.length) return;

      var terakhir = d.list[d.list.length - 1];
      if (Chat.idTerakhir === terakhir.chat_id) return;

      var menempel = (daftar.scrollTop + daftar.clientHeight + 40) >= daftar.scrollHeight;
      var adaBaru = false;

      d.list.forEach(function (c) {
        if (daftar.querySelector('[data-cid="' + c.chat_id + '"]')) return;
        if (c.milik_saya) return;

        if (daftar.querySelector('.empty')) daftar.innerHTML = '';
        daftar.insertAdjacentHTML('beforeend', Chat.baris(c));
        adaBaru = true;
      });

      Chat.idTerakhir = terakhir.chat_id;
      if (adaBaru && menempel) daftar.scrollTop = daftar.scrollHeight;
    }).catch(function () {});
  },

  intip: function () {
    api('apiChatList', { trx_id: Chat.trxId }).then(function (d) {
      var b = document.getElementById('chat-jml');
      if (!b) return;
      b.textContent = d.total ? d.total + ' pesan' : 'buka';
      if (d.total) b.className = 'badge brand';
    }).catch(function () {});
  },

  muat: function () {
    var isi = document.getElementById('chat-isi');
    if (!isi) return;

    isi.innerHTML = (typeof memuatHtml === 'function')
      ? memuatHtml() : '<div class="empty">Memuat…</div>';

    api('apiChatList', { trx_id: Chat.trxId }).then(function (d) {
      isi.innerHTML =
        '<div id="chat-daftar" style="max-height:320px;overflow-y:auto;' +
          'padding:4px 2px;margin-top:12px">' +
          (d.list.length
            ? d.list.map(Chat.baris).join('')
            : '<div class="empty" style="padding:18px"><b>Belum ada pesan</b>' +
              'Tulis di bawah kalau perlu mengabari divisi lain.</div>') +
        '</div>' +

        '<div class="inline mt16" style="flex-wrap:nowrap">' +
          '<input type="text" id="chat-ketik" maxlength="500" style="flex:1;min-width:0" ' +
            'placeholder="Tulis pesan…" autocomplete="off">' +
          '<button class="btn" id="chat-kirim">Kirim</button>' +
        '</div>';

      var kotak = document.getElementById('chat-ketik');
      kotak.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); Chat.kirim(); }
      };
      document.getElementById('chat-kirim').onclick = Chat.kirim;

      var daftar = document.getElementById('chat-daftar');
      if (daftar) daftar.scrollTop = daftar.scrollHeight;

      if (d.list.length) Chat.idTerakhir = d.list[d.list.length - 1].chat_id;
      Chat.aturJeda();

      var b = document.getElementById('chat-jml');
      if (b) b.textContent = 'tutup';

    }).catch(function (e) {
      isi.innerHTML = '<div class="empty"><b>Percakapan tidak bisa dimuat</b>' +
        Fmt.esc(e.message + (e.code ? '  [' + e.code + ']' : '')) + '</div>';
    });
  },

  baris: function (c) {
    var sendiri = c.milik_saya;

    return '<div data-cid="' + Fmt.esc(c.chat_id || '') +
        '" style="display:flex;margin-bottom:10px;' +
        (sendiri ? 'justify-content:flex-end' : '') + '">' +
      '<div style="max-width:78%;background:' +
        (sendiri ? 'var(--brand-soft)' : 'var(--paper)') + ';' +
        'padding:9px 12px;border-radius:12px">' +
        '<div class="small" style="font-weight:700;color:' +
          (sendiri ? 'var(--brand)' : 'var(--muted)') + '">' +
          Fmt.esc(c.user_name) + ' · ' + Fmt.esc(c.role_label) + '</div>' +
        '<div style="font-size:14px;margin-top:2px;white-space:pre-wrap;' +
          'word-break:break-word">' + Fmt.esc(c.pesan) + '</div>' +
        '<div class="small muted" style="margin-top:3px">' +
          Fmt.esc(Fmt.jam(c.at)) + '</div>' +
      '</div></div>';
  },

  kirim: function () {
    var kotak = document.getElementById('chat-ketik');
    if (!kotak) return;

    var teks = kotak.value.trim();
    if (!teks) return;

    /*
     * Pesannya langsung tampil, pengirimannya di belakang.
     *
     * Orang yang menulis sambil memegang barang tidak perlu
     * menunggu layar. Kalau gagal, pemberitahuannya muncul dan
     * pesannya bisa ditulis ulang.
     */
    kotak.value = '';
    var daftar = document.getElementById('chat-daftar');

    if (daftar) {
      if (daftar.querySelector('.empty')) daftar.innerHTML = '';
      daftar.insertAdjacentHTML('beforeend', Chat.baris({
        user_name: App.state.session.full_name,
        role_label: Fmt.roleLabel(App.state.session.role),
        pesan: teks, at: new Date().toISOString(), milik_saya: true
      }));
      daftar.scrollTop = daftar.scrollHeight;
    }

    api('apiChatKirim', { trx_id: Chat.trxId, pesan: teks, idem: uid() })
      .catch(function (e) {
        toast('Pesan gagal terkirim: ' + e.message, 'err');
      });
  }
};
</script>
