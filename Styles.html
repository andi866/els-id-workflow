<style>
/* ============================================================
   ELS.ID WORKFLOW — Styles
   Acuan rasa: terminal kasir toko. Padat, kontras tinggi,
   tombol besar, angka mudah dibaca sambil berdiri.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root{
  /*
   * Jingga sebagai warna utama.
   *
   * Biru sebelumnya netral tapi tidak berkesan apa-apa — sama
   * dengan ratusan aplikasi lain. Jingga lebih hangat, lebih
   * terlihat di layar terang, dan cocok dengan warna merek.
   *
   * Yang dipakai bukan jingga menyala: terlalu terang membuat mata
   * lelah untuk orang yang menatapnya seharian. Ini jingga tua
   * yang masih kuat di bawah lampu toko.
   */
  --brand:#E8590C;
  --brand-dark:#C44A08;
  --brand-soft:#FFF1E8;

  --ink:#1A1D23;
  --ink-2:#434A56;
  --muted:#71798A;
  --line:#E4E7EC;
  --paper:#F7F8FA;
  --surface:#FFFFFF;

  /*
   * Sisi kiri ikut putih.
   *
   * Panel gelap membuat layar terbelah dua dan terasa berat. Yang
   * putih tetap putih; yang menandai — menu terpilih, tombol utama,
   * angka pekerjaan — itu yang jingga.
   */
  --rail:#FFFFFF;
  --rail-2:#FFF4ED;
  --rail-ink:#5A6372;

  --ok:#1F8A4C;
  --warn:#B7791F;
  --danger:#C62828;
  --ok-soft:#E7F5EC;
  --warn-soft:#FDF3E2;
  --danger-soft:#FDEBEB;

  --r:10px;
  --r-lg:14px;
  --shadow-sm:0 1px 2px rgba(17,23,34,.05);
  --shadow:0 1px 2px rgba(17,23,34,.05), 0 10px 26px -14px rgba(17,23,34,.16);
  --shadow-lg:0 24px 60px -18px rgba(17,23,34,.28);
  --brand-ring:rgba(232,89,12,.18);
  --line-2:#EFF2F6;
  --rail-w:248px;
  --top-h:60px;
  --r-xl:18px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}

/* ---------- layar pembuka ---------- */
/* Gaya layar awal yang lama sudah tidak dipakai — bentuknya kini
   sama dengan .splash supaya tidak terlihat dua layar berurutan */

/* ============================================================
   LOGIN
   ============================================================ */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/*
 * Sisi kiri layar masuk memakai jingga.
 *
 * Panel putih polos di kedua sisi membuat layar masuk terlihat
 * belum jadi — tidak ada yang menandakan ini aplikasi siapa.
 * Jingga di satu sisi cukup untuk memberi wajah, dan sisi
 * isiannya tetap putih supaya tetap mudah dibaca.
 */
.login-side{
  background:linear-gradient(150deg, #F97316 0%, var(--brand) 52%, var(--brand-dark) 100%);
  color:#fff;padding:48px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}

/* Lingkaran samar supaya tidak terlihat datar */
.login-side::after{
  content:'';position:absolute;right:-90px;bottom:-110px;
  width:320px;height:320px;border-radius:50%;
  background:rgba(255,255,255,.1);
}

.login-side > *{position:relative;z-index:1}
.login-side h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.login-side p{color:rgba(255,255,255,.88);max-width:34ch;margin:0}
.login-flow{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.login-flow span{
  font-size:11px;font-weight:600;color:#fff;
  background:rgba(255,255,255,.18);border-radius:99px;padding:5px 11px;
}
.login-foot{color:rgba(255,255,255,.72);font-size:12px}

.login-main{background:var(--surface);display:grid;place-content:center;padding:32px}
.login-card{width:340px;max-width:100%}
.login-card h2{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.01em}
.login-card .sub{color:var(--muted);margin:0 0 26px}

/* keypad PIN */
.pin-row{display:flex;gap:9px;justify-content:center;margin:6px 0 18px}
.pin-dot{
  width:38px;height:48px;border:1.5px solid var(--line);border-radius:var(--r);
  display:grid;place-content:center;font-size:22px;font-weight:700;background:var(--paper);
  transition:border-color .12s, background .12s;
}
.pin-dot.filled{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.pin-dot.active{border-color:var(--brand)}

.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.keypad button{
  height:54px;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r);font-size:20px;font-weight:600;cursor:pointer;
  transition:transform .05s, background .12s;
}
.keypad button:hover{background:var(--paper)}
.keypad button:active{transform:scale(.96);background:var(--brand-soft)}
.keypad .k-wide{grid-column:span 1;font-size:14px;font-weight:600;color:var(--muted)}

/* ============================================================
   KERANGKA APLIKASI
   ============================================================ */
.shell{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100vh}

.rail{
  background:var(--rail);color:var(--rail-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
  border-right:1px solid var(--line);
}
.rail-top{padding:18px 18px 14px;border-bottom:1px solid var(--line-2)}
.rail-top b{color:var(--ink);font-size:16px;font-weight:800;letter-spacing:-.02em;display:block}
.rail-top small{color:var(--muted);font-size:11px}
.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
/*
 * Semua baris menu setinggi sama, termasuk judul kelompok.
 *
 * Sebelumnya judul kelompok memakai huruf lebih kecil, jadi
 * tingginya berbeda dari menu biasa dan sidebar terlihat
 * bertingkat-tingkat. Yang sama fungsinya sebaiknya sama bentuknya.
 */
.rail-nav a{
  display:flex;align-items:center;gap:11px;
  min-height:42px;padding:0 12px;border-radius:8px;
  color:var(--rail-ink);font-weight:500;font-size:13.5px;
  margin-bottom:2px;cursor:pointer;
  transition:background .12s,color .12s;
}
.rail-nav a:hover{background:var(--paper);color:var(--ink)}

/*
 * Menu terpilih ditandai latar jingga muda dan tulisan jingga,
 * bukan blok jingga penuh. Blok penuh di panel putih terlihat
 * seperti tombol yang menunggu ditekan, padahal sudah dibuka.
 */
.rail-nav a.on{
  background:var(--brand-soft);color:var(--brand-dark);font-weight:700;
  box-shadow:inset 3px 0 0 var(--brand);
}
.rail-nav a.soon{opacity:.42;cursor:not-allowed}
.rail-nav a.soon:hover{background:transparent;color:var(--rail-ink)}
.rail-nav .ph{
  margin-left:auto;font-size:10px;font-weight:600;background:var(--paper);
  color:var(--muted);padding:2px 6px;border-radius:5px;
}
.rail-ico{width:20px;text-align:center;font-size:15px}
/* Dasar menu samping sudah kosong — nama dan tombolnya di kanan atas */

.main{display:flex;flex-direction:column;min-width:0}
.topbar{
  min-height:var(--top-h);background:rgba(255,255,255,.92);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:20;
}
.topbar h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.015em}
.topbar .spacer{flex:1}
.burger{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:4px}
.content{padding:24px 24px 72px;max-width:1240px;width:100%}

/* ============================================================
   KOMPONEN
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--shadow-sm)}
.card + .card{margin-top:14px}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700}
.card .hint{color:var(--muted);margin:0 0 16px;font-size:13px}

.grid{display:grid;gap:12px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}

/* kartu angka ringkas */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 20px;box-shadow:var(--shadow-sm)}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.stat span{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}

.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .note{color:var(--muted);font-size:12px;margin-top:4px}
input[type=text],input[type=password],input[type=tel],input[type=email],input[type=number],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r);
  background:var(--surface);outline:none;transition:border-color .12s;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
input::placeholder,textarea::placeholder{color:#9AA4B2}
input:disabled,select:disabled{background:var(--paper);color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 16px;border-radius:var(--r);border:1.5px solid transparent;
  background:var(--brand);color:#fff;font-weight:600;cursor:pointer;
  font-size:13.5px;
  transition:background .14s,transform .06s,box-shadow .14s;
  box-shadow:var(--shadow-sm);
}
.btn:hover{background:var(--brand-dark)}
.btn:active{transform:translateY(1px)}
.btn:disabled{background:#B9C2CE;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:none}
.btn.ghost:hover{background:var(--paper)}
.btn.danger{background:var(--danger)}
.btn.danger:hover{background:#a71d1d}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn.lg{padding:14px 20px;font-size:15px}

/* kotak keterangan berwarna */
.ok-box{background:var(--ok-soft);border:1px solid rgba(31,138,76,.18);
  border-radius:var(--r);padding:12px 16px}
.sub{color:var(--muted);font-size:13px}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:11.5px;font-weight:700;background:var(--paper);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;
}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}

/* tabel — baris punya garis status di sisi kiri */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow-sm)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;padding:11px 15px;font-weight:600;font-size:11.5px;color:var(--muted);
  background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap;
  text-transform:uppercase;letter-spacing:.04em;
}
th.num{text-align:right}
td.mid,th.mid{text-align:center}
td{padding:12px 15px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFBFC}
td.num{text-align:right;font-weight:600}
/* ============================================================
   Menu berkelompok — hanya dipakai Super Admin

   Judul kelompok terlihat seperti menu biasa tapi lebih redup, dan
   isinya menjorok sedikit. Yang terlipat menyembunyikan menu yang
   sedang tidak dipakai tanpa menghilangkannya.
   ============================================================ */
.nav-grup{margin-top:4px}
/*
 * Judul kelompok memakai ukuran huruf yang sama dengan menu biasa.
 *
 * Sebelumnya lebih kecil dan kapital semua — niatnya membedakan,
 * hasilnya sidebar terlihat naik turun karena tinggi barisnya
 * berbeda. Yang membedakan sekarang cukup warna dan panahnya.
 */
.nav-grup-judul{
  cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:600;
  letter-spacing:0; text-transform:none;
}
.nav-grup-judul:hover{color:var(--ink)}
.nav-panah{margin-left:auto; font-size:10px; opacity:.65; transition:transform .14s}
.nav-grup.buka .nav-panah{transform:rotate(90deg)}
.nav-grup-isi{display:none; margin:2px 0 8px}
.nav-grup.buka .nav-grup-isi{display:block}
.nav-grup-isi a{padding-left:38px; position:relative}
.nav-grup-isi a::before{
  content:''; position:absolute; left:20px; top:13px;
  width:2px; height:16px; background:var(--line); border-radius:2px;
}

/* ============================================================
   Tabel barang — dipakai semua divisi

   Satu bentuk untuk semua: Sales, Gudang, Admin, Kasir, Teknisi.
   Kepala tabel gelap supaya batas antara judul dan isi tegas,
   angka rata kanan, nama barang tebal, kode di bawahnya kecil.
   ============================================================ */
.tbl-barang{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.tbl-barang table{font-size:13.5px}
.tbl-barang thead th{
  background:#1F2733;color:#fff;font-weight:600;font-size:11.5px;
  letter-spacing:.04em;text-transform:uppercase;padding:10px 14px;border:0;
}
.tbl-barang thead th.num{text-align:right}
.tbl-barang thead th.mid{text-align:center}
.tbl-barang tbody td{padding:12px 14px;vertical-align:middle}
.tbl-barang tbody tr:last-child td{border-bottom:0}
.tbl-barang td.num{text-align:right;font-weight:700}
.tbl-barang td.mid{text-align:center}

.brg-nama{font-weight:700;font-size:14px;line-height:1.3}
.brg-kode{font-size:11.5px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.brg-sn{font-size:11.5px;margin-top:4px}
.brg-sn span{
  display:inline-block;background:var(--paper);border:1px solid var(--line);
  border-radius:5px;padding:2px 7px;margin:2px 4px 0 0;
  font-family:var(--mono);letter-spacing:.02em;
}
.brg-catatan{font-size:12px;color:var(--warn);margin-top:3px}
.brg-coret{font-size:11.5px;color:var(--muted);text-decoration:line-through}

/* Baris ringkasan di kaki tabel */
.tbl-barang tfoot td{
  padding:11px 14px;background:var(--paper);border-top:1px solid var(--line);
  border-bottom:0;font-weight:600;
}
.tbl-barang tfoot tr.total td{font-size:16px;font-weight:800;background:#1F2733;color:#fff}

.row-mark{border-left:3px solid transparent}
.row-mark.on{border-left-color:var(--ok)}
.row-mark.off{border-left-color:var(--danger)}
.row-mark.hold{border-left-color:var(--warn)}

.empty{text-align:center;padding:52px 24px;color:var(--muted);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:5px}

/* ---------- modal ---------- */
.modal-bg{
  position:fixed;inset:0;background:rgba(17,22,29,.5);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.modal{
  background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:480px;
  max-height:88vh;overflow:auto;box-shadow:var(--shadow-lg);
  animation:pop .14s ease-out;
}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-head{padding:18px 20px 0}
.modal-head h3{margin:0;font-size:17px;font-weight:700}
.modal-head p{color:var(--muted);margin:5px 0 0;font-size:13px}
.modal-body{padding:18px 20px}
.modal-foot{padding:14px 20px 18px;display:flex;gap:9px;justify-content:flex-end;border-top:1px solid var(--line)}

/* ---------- toast ---------- */
#toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{
  background:var(--rail);color:#fff;padding:12px 15px;border-radius:var(--r);
  box-shadow:var(--shadow-lg);max-width:340px;font-size:13.5px;font-weight:500;
  display:flex;gap:9px;align-items:flex-start;animation:pop .14s ease-out;
}
.toast.ok{background:#15653A}
.toast.err{background:#9E2020}
.toast b{display:block;margin-bottom:2px}

/* ============================================================
   Baris tombol penyaring

   Deretan tombol seperti "Perlu ditangani / Menunggu aktivasi /
   Menunggu diambil / Selesai hari ini" di layar sempit terpecah
   jadi tiga baris bertingkat — makan tempat dan terlihat berantakan.

   Digeser ke samping jauh lebih rapi: satu baris, tingginya tetap,
   dan urutannya tidak berubah-ubah mengikuti lebar layar.
   ============================================================ */
.chips,
#ad-scope, #ad-hari, #gd-filter, #hs-hari, #ks-scope, #lc-hari,
#lp-hari, #lp-tab, #rk-hari, #t-filter, #tk-scope, #rp-hari{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.chips .btn,
#ad-scope .btn, #ad-hari .btn, #gd-filter .btn, #hs-hari .btn,
#ks-scope .btn, #lc-hari .btn, #lp-hari .btn, #lp-tab .btn,
#rk-hari .btn, #t-filter .btn, #tk-scope .btn, #rp-hari .btn{
  border-radius:99px;box-shadow:none;
}

/*
 * Kartu daftar: isi di kiri, tombol di kanan, sejajar atas.
 *
 * Dipakai kartu antrian di Gudang, Teknisi, Indent, dan Ganti Unit.
 * Tanpa ini tombolnya menempel di tengah dan tinggi kartu berbeda
 * mengikuti panjang keterangannya.
 */
.card > .between{align-items:flex-start}
.card > .between > div:first-child{min-width:0;flex:1}

/* Hanya tampil di layar HP — lihat aturan tabel di bagian bawah */
.hp-only { display: none }

/* ---------- lain-lain ---------- */
.inline{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mb0{margin-bottom:0}.mt16{margin-top:16px}.mt8{margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sep{height:1px;background:var(--line);margin:16px 0}
.spin{
  width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;
  border-radius:50%;animation:sp .6s linear infinite;display:inline-block;
}
@keyframes sp{to{transform:rotate(360deg)}}

:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ============================================================
   LAYAR KECIL
   ============================================================ */
@media (max-width:980px){
  .login{grid-template-columns:1fr}

  /*
   * Di HP sisi jingga jadi kepala yang pendek, bukan setengah
   * layar. Yang dibutuhkan di situ cuma kotak PIN — panel besar
   * mendorongnya turun sampai harus digulir.
   */
  .login-side{padding:26px 22px 22px;min-height:auto}
  .login-side h1{font-size:24px}
  .login-side p{font-size:13px}
  .login-flow{display:none}
  .login-foot{display:none}
  .login-main{padding:24px 18px 36px}
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}

  /*
   * Ruang aman di tepi layar.
   *
   * Ponsel berponi atau berlayar melengkung memotong beberapa
   * milimeter di atas dan bawah. Tanpa ruang aman, judul halaman
   * tertutup poni dan tombol paling bawah sulit ditekan.
   */
  .rail{
    position:fixed;left:0;top:0;bottom:0;width:min(84vw,var(--rail-w));z-index:60;
    transform:translateX(-100%);transition:transform .2s cubic-bezier(.2,.9,.3,1);
    height:100%;padding-top:env(safe-area-inset-top,0px);
  }
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(15,20,28,.5)}
  .rail-nav a{min-height:48px;font-size:14.5px}
  .nav-grup-isi a{padding-left:42px}
  .rail-user button{padding:11px}

  .burger{display:block}
  .topbar{
    padding:0 16px;
    padding-top:env(safe-area-inset-top,0px);
    min-height:calc(var(--top-h) + env(safe-area-inset-top,0px));
  }
  .content{padding:16px 16px calc(88px + env(safe-area-inset-bottom,0px))}

  /* Tombol cukup besar untuk ditekan jempol sambil berdiri */
  .btn{padding:11px 16px;font-size:14px;min-height:42px}
  .btn.sm{padding:8px 13px;font-size:12.5px;min-height:34px}
  .btn.lg{padding:15px 20px;font-size:15.5px;min-height:50px}

  input[type=text],input[type=password],input[type=tel],input[type=email],
  input[type=number],input[type=date],select,textarea{font-size:16px;padding:12px 13px}

  /* Dialog naik dari bawah, seperti kebiasaan aplikasi ponsel */
  .modal-bg{padding:12px;align-items:flex-end}
  .modal{max-height:92vh;border-radius:18px 18px 0 0;max-width:none}
  .modal-foot{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  #toasts{bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  /*
   * Di HP, kartu berpasangan dikembalikan ke satu kolom.
   *
   * Dua kolom membuat judul kartu terpotong dan keterangannya
   * tertekan jadi tiga baris. Yang muat belum tentu terbaca.
   *
   * Angka ringkas tetap dua kolom karena isinya pendek — satu
   * angka dan satu keterangan singkat.
   */
  .grid{gap:10px}
  .grid.c2{grid-template-columns:1fr}
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
  .modal-foot{flex-direction:column-reverse}
  .modal-foot .btn{width:100%}
  #toasts{left:14px;right:14px}
  .toast{max-width:none}
  .empty{padding:40px 18px}

  /* --- Tabel di layar HP ---

     Dulu tabel dipaksa muat selebar layar. Akibatnya nama barang
     terpecah satu dua huruf per baris dan barisnya jadi setinggi
     telapak tangan — sulit dibaca, sulit ditekan.

     Sekarang tabel diberi lebar minimum lalu digeser ke samping.
     Membaca sambil menggeser jauh lebih mudah daripada membaca
     tulisan yang terpotong-potong. */
  .table-wrap{-webkit-overflow-scrolling:touch;position:relative}
  .table-wrap table{min-width:620px}
  .tbl-barang{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-barang table{min-width:580px}

  th,td{padding:9px 10px}
  .brg-nama{font-size:13.5px}

  /* Kolom nama barang tidak boleh terjepit */
  .tbl-barang td:nth-child(2),
  .table-wrap td:first-child{min-width:170px}

  /* Kotak isian di dalam tabel — 16px mencegah layar HP membesar
     sendiri saat diketik */
  table input,table select{font-size:16px;padding:8px 10px;min-width:82px}

  .card{padding:16px;border-radius:var(--r)}
  .card h3{font-size:15px}

  /* ============================================================
     Tabel di layar HP

     Tabel lebar memang bisa digeser, tapi menggesernya sambil
     membaca itu melelahkan — dan kolom yang penting sering berada
     di ujung kanan yang tidak terlihat.

     Jadi kolom yang bisa ditunda diberi tanda, lalu disembunyikan
     di layar sempit. Isinya tidak hilang: yang penting tetap ada
     di kolom utama, dan rinciannya muncul begitu transaksinya
     dibuka.
     ============================================================ */
  /*
   * Tabel digeser ke samping, bukan diringkas ke bawah.
   *
   * Sebelumnya kolom yang kurang penting disembunyikan supaya muat
   * di layar sempit. Hasilnya tiap baris jadi menjulang ke bawah —
   * satu transaksi memakan setengah layar, dan yang dicari justru
   * ada di kolom yang disembunyikan.
   *
   * Sekarang semua kolom tetap ada dan tabelnya digeser dengan jari.
   * Itu kebiasaan yang sudah dikenal orang dari aplikasi lain.
   */
  th.kol-opsional, td.kol-opsional { display: table-cell; }
  .hp-only { display: none }

  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch }
  .table-wrap table { min-width: 720px }

  .table-wrap th,
  .table-wrap td { white-space: nowrap }

  /*
   * Kolom nomor tidak boleh turun ke bawah.
   *
   * Nomor transaksi dan nomor nota adalah satu kesatuan yang
   * dibaca sekali lihat — dipecah jadi tiga baris, keduanya jadi
   * sulit dicocokkan dengan kertas di tangan.
   *
   * Yang boleh turun cuma nama customer, karena namanya memang
   * bisa panjang dan tidak perlu dibaca sebagai satu kesatuan.
   */
  .table-wrap td:first-child,
  .table-wrap td:first-child b,
  .table-wrap td:first-child div { white-space: nowrap }

  .table-wrap td:nth-child(2) { white-space: normal; max-width: 200px }

  /* ------------------------------------------------------------
     Nama barang di layar HP

     Nama barang di sistem ini panjang-panjang — merek, spesifikasi,
     garansi, catatan, semuanya dalam satu baris. Dalam kolom sempit
     itu terpecah jadi belasan baris, dan satu barang memakan satu
     layar penuh.

     Dipotong dua baris dengan titik-titik. Nama lengkapnya tetap
     ada: ditekan lama akan muncul, dan di layar lebar tampil utuh.
     ------------------------------------------------------------ */
  /*
   * Dua baris, lalu titik-titik. Diketuk sekali untuk melihat
   * seluruhnya.
   *
   * Memotong tanpa jalan keluar berarti ada nama yang tidak pernah
   * bisa dibaca utuh — dan beberapa barang hanya bisa dibedakan
   * dari ujung namanya.
   */
  .table-wrap td:nth-child(2) b {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.34;
    cursor: pointer;
  }

  .table-wrap td.lebar b,
  .table-wrap td.lebar > div:first-child {
    -webkit-line-clamp: unset;
    overflow: visible;
  }

  /*
   * Tanda kecil bahwa namanya masih ada lanjutannya.
   *
   * Tanpa tanda, titik-titik terbaca sebagai nama yang memang
   * begitu — dan tidak ada yang terpikir mengetuknya.
   */
  .table-wrap td:first-child:not(.lebar) b::after {
    content: ' ⌄';
    color: var(--brand);
    font-weight: 700;
  }
  .table-wrap td.lebar:first-child b::after { content: '' }

  /* ------------------------------------------------------------
     Hasil pencarian barang tampil utuh

     Saat memilih barang, nama lengkapnya justru yang menentukan —
     dua barang bisa hanya berbeda di ujung namanya. Memotongnya di
     situ memaksa orang mengetuk dulu sebelum bisa memilih, dan itu
     satu langkah tambahan pada pekerjaan yang paling sering
     diulang.

     Setelah masuk ke daftar pesanan barulah dipotong — di sana
     barangnya sudah dipilih, tinggal dikenali.
     ------------------------------------------------------------ */
  .cari-hasil td b,
  .cari-hasil td > div {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
    white-space: normal;
    line-height: 1.34;
  }

  /* ------------------------------------------------------------
     Hasil pencarian disusun ke bawah, bukan ke samping

     Tiga kolom berdampingan di layar selebar telapak tangan
     membuat nama barang tersisa sepertiga lebar — dan nama itulah
     yang menentukan pilihan.

     Jadi barisnya dipecah: nama memakai selebar layar, lalu harga
     di kiri dan tombol Tambah di kanan pada baris di bawahnya.
     ------------------------------------------------------------ */
  .cari-hasil,
  .cari-hasil table { width: 100%; max-width: 100%; overflow: visible }

  .cari-hasil table,
  .cari-hasil tbody,
  .cari-hasil tr { display: block; width: 100% }

  .cari-hasil tr {
    border-bottom: 1px solid var(--line);
    padding: 12px 0 14px;
  }

  /*
   * Nama barang memakai lebar penuh.
   *
   * Sebelumnya masih tersisa separuh layar karena tabelnya ikut
   * aturan lebar minimum kolom. Di sini seluruh barisnya ditata
   * ulang, jadi tidak ada lagi kolom yang menyisakan ruang kosong
   * di kanan.
   */
  .cari-hasil td:first-child {
    display: block;
    width: 100%;
    max-width: none;
    min-width: 0;
    border: 0;
    padding: 0;
  }
  .cari-hasil td:first-child b::after { content: '' !important }

  /*
   * Harga dan tombol pada satu baris: harga menempel kiri, tombol
   * menempel kanan. Dipakai flex supaya benar-benar di ujung,
   * bukan sekadar rata kanan di dalam kolomnya sendiri.
   */
  /*
   * Lebar minimum kolom dimatikan untuk hasil pencarian.
   *
   * Aturan umum tabel memberi tiap kolom lebar minimum supaya
   * angkanya tidak terpotong. Di sini aturan itu justru yang
   * membuat barisnya melebar melebihi layar — harga dan tombol
   * terdorong ke tengah, dan nama barangnya kehilangan ruang.
   */
  .cari-hasil td { min-width: 0 !important; max-width: none }

  /* Harga dan tombol dalam satu baris, menempel ke dua ujung */
  .cari-hasil tr {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
  }

  .cari-hasil td:first-child { flex: 0 0 100% }

  .cari-hasil td:nth-child(2) {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    border: 0;
    padding: 10px 0 0;
    font-size: 15.5px;
    font-weight: 800;
    text-align: left;
  }

  .cari-hasil td:last-child {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-end;
    border: 0;
    padding: 10px 0 0;
    width: auto !important;
  }
  .cari-hasil td:last-child .btn { padding: 10px 22px; width: auto }

  .table-wrap td { min-width: 118px }
  .table-wrap td:first-child { max-width: 190px }

  /* Kotak isian di dalam tabel tidak ikut menyempit */
  .table-wrap td input { min-width: 72px }

  /* Tabel tidak lagi dipaksa selebar 640px */
  .table-wrap table { min-width: 0; }
  .tbl-barang table { min-width: 520px; }

  th, td { padding: 10px 10px; }
  th { font-size: 10.5px; letter-spacing: .03em; }
  td { font-size: 13px; }

  /* Kolom pertama tidak perlu selebar itu di HP */
  .table-wrap td:first-child { min-width: 0 }

  /* Angka tetap mudah dibaca */
  td.num { white-space: nowrap }

  /* ------------------------------------------------------------
     Kotak tanggal di layar HP

     Bentuk bawaannya memakan lebar — "dd/mm/yyyy" ditambah ikon
     kalender, dan dua kotak berdampingan membuat tombol di
     sebelahnya terdorong ke baris berikutnya dan saling menindih.

     Di HP kotaknya dipersempit sampai cukup untuk ikonnya saja.
     Tanggal yang sedang dipilih tetap terbaca di penanda periode
     di bawahnya.
     ------------------------------------------------------------ */
  /*
   * Tanggalnya tetap terbaca.
   *
   * Sempat saya sembunyikan tulisannya supaya kotaknya muat —
   * keliru. Yang dipilih orang jadi tidak terlihat sama sekali, dan
   * kotak kosong terbaca sebagai pilihan yang gagal tersimpan.
   *
   * Yang dikecilkan hurufnya dan jaraknya, bukan isinya.
   */
  input[type=date] {
    min-width: 0;
    flex: 1 1 118px;
    width: auto !important;
    padding: 9px 7px;
    font-size: 12.5px;
  }
  input[type=date]::-webkit-calendar-picker-indicator {
    margin-left: 2px;
    padding: 0;
  }

  /* Baris tanggal dan tombol tetap satu baris */
  .inline { gap: 7px }

  /* Penyaring digeser ke samping, tidak dilipat bertingkat */
  .chips,
  #ad-scope, #ad-hari, #gd-filter, #hs-hari, #ks-scope, #lc-hari,
  #lp-hari, #lp-tab, #rk-hari, #t-filter, #tk-scope, #rp-hari{
    flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:4px;margin:0 -4px;padding-left:4px;padding-right:4px;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar,
  #ad-scope::-webkit-scrollbar, #ad-hari::-webkit-scrollbar,
  #gd-filter::-webkit-scrollbar, #hs-hari::-webkit-scrollbar,
  #ks-scope::-webkit-scrollbar, #lc-hari::-webkit-scrollbar,
  #lp-hari::-webkit-scrollbar, #lp-tab::-webkit-scrollbar,
  #rk-hari::-webkit-scrollbar, #t-filter::-webkit-scrollbar,
  #tk-scope::-webkit-scrollbar, #rp-hari::-webkit-scrollbar{display:none}

  .chips .btn,
  #ad-scope .btn, #ad-hari .btn, #gd-filter .btn, #hs-hari .btn,
  #ks-scope .btn, #lc-hari .btn, #lp-hari .btn, #lp-tab .btn,
  #rk-hari .btn, #t-filter .btn, #tk-scope .btn, #rp-hari .btn{
    flex-shrink:0;
  }
  .stat{padding:12px 16px;border-radius:var(--r)}
  .between{flex-wrap:wrap;gap:10px}
  .inline{flex-wrap:wrap}

  /* Angka ringkas di atas layar: dua kolom, bukan satu panjang */
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:22px}
  .stat span{font-size:11.5px}

  /* Judul halaman jangan memakan tempat */
  .topbar h1{font-size:16px}
}

/* Layar sangat kecil */
@media (max-width:400px){
  .grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}
  .content{padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  .card{padding:14px}
  .stat b{font-size:22px}
}

/* ============================================================
   PENANDA SEDANG MEMUAT

   Garis tipis di paling atas layar. Tidak menutupi apa pun dan
   tidak menahan apa pun — hanya memberi tahu bahwa ada yang
   sedang berjalan, supaya layar yang diam sesaat tidak dikira
   macet lalu ditekan berulang kali.
   ============================================================ */
#muat-garis {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 3px;
  z-index: 9999;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s ease;
}
#muat-garis.jalan { opacity: 1 }

#muat-garis i {
  display: block;
  height: 100%;
  width: 38%;
  border-radius: 0 3px 3px 0;
  background: linear-gradient(90deg,
    transparent 0%, var(--brand) 45%, var(--brand) 55%, transparent 100%);
  transform: translateX(-100%);
}
#muat-garis.jalan i { animation: muatGeser 1.05s cubic-bezier(.4,0,.2,1) infinite }

@keyframes muatGeser {
  0%   { transform: translateX(-100%) }
  100% { transform: translateX(300%) }
}

/* Titik bergerak pada tulisan "Memuat…" */
.titik i {
  display: inline-block;
  font-style: normal;
  animation: titikNaik 1.2s infinite;
}
.titik i:nth-child(2) { animation-delay: .18s }
.titik i:nth-child(3) { animation-delay: .36s }

@keyframes titikNaik {
  0%, 60%, 100% { opacity: .25; transform: translateY(0) }
  30%           { opacity: 1;   transform: translateY(-2px) }
}

/* Hormati yang mematikan animasi di perangkatnya */
@media (prefers-reduced-motion: reduce) {
  #muat-garis.jalan i, .titik i { animation: none }
  .titik i { opacity: .6 }
}

/* ============================================================
   MENU BAWAH (hanya layar HP)

   Menu samping memaksa dua ketukan untuk tiap perpindahan: buka
   laci dulu, baru pilih. Padahal yang dipakai sepanjang hari cuma
   tiga sampai empat menu.

   Yang sering dipakai ditaruh di bawah, dalam jangkauan ibu jari.
   Sisanya tetap ada di balik tombol Menu.
   ============================================================ */
.tabbar { display: none }

@media (max-width: 760px) {
  .tabbar {
    display: flex;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 60;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: 0 -2px 14px rgba(15, 20, 28, .06);
  }

  .tabbar .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 9px 2px 7px;
    color: var(--muted);
    text-decoration: none;
    font-size: 11px;
    font-weight: 600;
    position: relative;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .tabbar .tab-ikon { font-size: 18px; line-height: 1 }
  .tabbar .tab-teks {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .tabbar .tab.on { color: var(--brand) }

  /* Garis penanda di atas menu yang sedang dibuka */
  .tabbar .tab.on::before {
    content: "";
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 26px; height: 3px;
    border-radius: 0 0 3px 3px;
    background: var(--brand);
  }

  /* Angka pekerjaan menempel di ikonnya */
  .tabbar .tab .nb {
    position: absolute;
    top: 4px;
    left: 50%;
    margin-left: 6px;
    background: var(--danger);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px; height: 16px;
    border-radius: 99px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
  }

  /* Isi halaman diberi ruang supaya tidak tertutup menu bawah */
  .content { padding-bottom: calc(74px + env(safe-area-inset-bottom, 0px)) }

  /* Tombol ☰ di atas tidak perlu lagi — sudah ada di menu bawah */
  .burger { display: none }
}

/* ============================================================
   KOTAK PESAN MASUK

   Muncul di pojok kanan bawah pada layar lebar, dan di atas menu
   bawah pada layar HP — supaya tidak menutupi tombol yang sedang
   dipakai orangnya.
   ============================================================ */
#pesan-masuk {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 9998;
  max-width: 330px;
  background: var(--brand);
  color: #fff;
  padding: 13px 15px;
  border-radius: 13px;
  box-shadow: 0 10px 28px rgba(232, 89, 12, .34);
  cursor: pointer;
  animation: pesanNaik .22s ease-out;
}

@keyframes pesanNaik {
  from { opacity: 0; transform: translateY(10px) }
  to   { opacity: 1; transform: translateY(0) }
}

@media (max-width: 760px) {
  #pesan-masuk {
    left: 12px;
    right: 12px;
    max-width: none;
    bottom: calc(78px + env(safe-area-inset-bottom, 0px));
  }
}

@media (prefers-reduced-motion: reduce) {
  #pesan-masuk { animation: none }
}

/* ============================================================
   PENANDA SINKRON BERBENTUK AWAN

   Menggantikan garis berjalan di atas layar. Garis itu menarik
   mata ke tempat yang tidak ada apa-apanya, dan bergerak terus
   walau tidak ada yang perlu dilihat.

   Awan diam di satu tempat. Yang berubah cuma titik kecilnya.
   ============================================================ */
.awan {
  position: relative;
  background: none;
  border: 0;
  padding: 2px 6px;
  color: var(--muted);
  cursor: pointer;
  line-height: 0;
  -webkit-tap-highlight-color: transparent;
}

.awan-titik {
  position: absolute;
  right: 2px;
  bottom: 1px;
  width: 9px;
  height: 9px;
  border-radius: 99px;
  border: 2px solid var(--surface);
  background: var(--muted);
  transition: background .2s ease;
}

.awan-titik.ok      { background: var(--ok) }
.awan-titik.kirim   { background: var(--brand); animation: awanKedip 1s ease-in-out infinite }
.awan-titik.gagal   { background: var(--danger) }
.awan-titik.offline { background: var(--muted) }

@keyframes awanKedip {
  0%, 100% { opacity: 1 }
  50%      { opacity: .25 }
}

/* Saat gagal, awannya ikut memerah supaya terlihat dari jauh */
.awan:has(.awan-titik.gagal) { color: var(--danger) }

@media (prefers-reduced-motion: reduce) {
  .awan-titik.kirim { animation: none; opacity: .7 }
}

/* Garis memuat lama tidak dipakai lagi */
#muat-garis { display: none !important }

/* ============================================================
   MENU AKUN DI KANAN ATAS

   Letaknya sama dengan hampir semua aplikasi lain, jadi orang
   mencarinya di situ tanpa diberi tahu.
   ============================================================ */
.akun { position: relative }

.akun-tombol {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 4px 12px 4px 4px;
  cursor: pointer;
  color: var(--ink-2);
  font-weight: 600;
  font-size: 13px;
  transition: border-color .15s ease;
}
.akun-tombol:hover { border-color: var(--brand) }

.akun-inisial {
  width: 28px; height: 28px;
  border-radius: 99px;
  background: var(--brand);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 13px;
}

.akun-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 232px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: none;
  z-index: 70;
}
.akun-menu.buka { display: block }

.akun-kepala {
  padding: 10px 12px 12px;
  border-bottom: 1px solid var(--line-2);
  margin-bottom: 6px;
}

.akun-item {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: 0;
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
}
.akun-item:hover { background: var(--paper) }

@media (max-width: 760px) {
  /* Di HP cukup inisialnya — nama divisi sudah ada di tempat lain */
  .akun-nama { display: none }
  .akun-tombol { padding: 4px }
  .akun-menu { right: 0; min-width: 214px }
}

/* Titik perjalanan pesanan di daftar Pesanan Saya */
.jejak { display: flex; gap: 5px; margin-top: 7px }

.jejak-titik {
  width: 18px;
  height: 4px;
  border-radius: 99px;
  background: var(--line);
}
.jejak-titik.lewat { background: var(--ok) }
