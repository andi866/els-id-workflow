<script>
/* ============================================================
   Halaman Login
   Keypad angka dipakai karena aplikasi sering diakses dari
   layar sentuh di meja toko, dan bentuknya sudah dikenal staf
   dari mesin EDC.
   ============================================================ */
App.pages.login = {
  pin: '',
  busy: false,

  html: function () {
    return '' +
      '<div class="login">' +
        '<div class="login-side">' +
          '<div>' +
            '<h1>' + Fmt.esc(App.state.meta.company) + '</h1>' +
            '<p>Satu tempat untuk melacak transaksi dari customer mengisi data ' +
              'sampai selesai dikerjakan Teknisi Support.</p>' +
            '<div class="login-flow">' +
              '<span>Customer</span><span>Sales</span><span>Gudang</span>' +
              '<span>Admin</span><span>Kasir</span><span>Teknisi</span>' +
            '</div>' +
          '</div>' +
          '<div class="login-foot">Versi ' + Fmt.esc(App.state.meta.version) + '</div>' +
        '</div>' +

        '<div class="login-main">' +
          '<div class="login-card">' +
            '<h2>Masuk</h2>' +
            '<p class="sub">Gunakan username dan PIN dari Super Admin.</p>' +

            '<div class="field">' +
              '<label for="l-user">Username</label>' +
              '<input type="text" id="l-user" autocomplete="username" ' +
                'autocapitalize="none" spellcheck="false" placeholder="contoh: andi">' +
            '</div>' +

            '<div class="field">' +
              '<label>PIN</label>' +
              '<div class="pin-row" id="pin-row">' +
                [0,1,2,3,4,5].map(function (i) {
                  return '<div class="pin-dot" data-i="' + i + '"></div>';
                }).join('') +
              '</div>' +
            '</div>' +

            '<div class="keypad" id="keypad">' +
              [1,2,3,4,5,6,7,8,9].map(function (n) {
                return '<button type="button" data-n="' + n + '">' + n + '</button>';
              }).join('') +
              '<button type="button" class="k-wide" data-act="clear">Hapus</button>' +
              '<button type="button" data-n="0">0</button>' +
              '<button type="button" class="k-wide" data-act="back">←</button>' +
            '</div>' +

            '<button class="btn block lg mt16" id="l-go">Masuk</button>' +
            '<p class="small muted mt8 mb0">Lupa PIN? Hubungi Super Admin untuk mereset.</p>' +
          '</div>' +
        '</div>' +
      '</div>';
  },

  mount: function () {
    var self = this;
    self.pin = '';
    self.busy = false;

    var draw = function () {
      document.querySelectorAll('#pin-row .pin-dot').forEach(function (d, i) {
        d.classList.toggle('filled', i < self.pin.length);
        d.classList.toggle('active', i === self.pin.length);
        d.textContent = i < self.pin.length ? '•' : '';
      });
    };

    document.getElementById('keypad').onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      if (b.dataset.act === 'clear') self.pin = '';
      else if (b.dataset.act === 'back') self.pin = self.pin.slice(0, -1);
      else if (self.pin.length < 6) self.pin += b.dataset.n;
      draw();
      if (self.pin.length === 6) setTimeout(submit, 120);
    };

    // Tetap bisa mengetik dengan keyboard fisik
    document.addEventListener('keydown', function onKey(e) {
      if (!document.getElementById('keypad')) { document.removeEventListener('keydown', onKey); return; }
      if (document.activeElement && document.activeElement.id === 'l-user') {
        if (e.key === 'Enter') document.getElementById('l-user').blur();
        return;
      }
      if (/^[0-9]$/.test(e.key) && self.pin.length < 6) { self.pin += e.key; draw();
        if (self.pin.length === 6) setTimeout(submit, 120); }
      else if (e.key === 'Backspace') { self.pin = self.pin.slice(0, -1); draw(); }
      else if (e.key === 'Enter') submit();
    });

    var submit = function () {
      if (self.busy) return;
      var u = document.getElementById('l-user').value.trim().toLowerCase();
      if (!u) { toast('Username belum diisi.', 'err'); document.getElementById('l-user').focus(); return; }
      if (self.pin.length !== 6) { toast('PIN harus 6 digit.', 'err'); return; }

      self.busy = true;
      var btn = document.getElementById('l-go');
      btnBusy(btn, true, 'Memeriksa');

      api('apiLogin', { username: u, pin: self.pin, device: navigator.userAgent })
        .then(function (session) {
          App.state.session = session;
          App.afterLogin();
          toast('Selamat datang, ' + session.full_name + '.', 'ok');
        })
        .catch(function (e) {
          self.busy = false;
          self.pin = ''; draw();
          btnBusy(btn, false, 'Masuk');
          toast(e.message, 'err');
        });
    };

    document.getElementById('l-go').onclick = submit;
    draw();
    document.getElementById('l-user').focus();
  }
};
</script>
